<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FLIX</title>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<style>
:root {
    --primary: #ff1744;
    --primary-gradient: linear-gradient(45deg, #ff1744, #ff5252);
    --bg-dark: #0a0a0a;
    --text-main: #ffffff;
    --text-muted: #888888;
}

*{
    box-sizing: border-box;
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
}

body{
    background: #000;
    color: var(--text-main);
    overflow: hidden;
    height: 100vh; width: 100vw;
}

header{
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 55px;
    display: flex; align-items: center; justify-content: center;
    z-index: 30;
    background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, transparent 100%);
    pointer-events: none;
}
header * { pointer-events: auto; }

.logo{
    font-size: 24px; font-weight: 900; letter-spacing: 2px;
    background: var(--primary-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.feed{
    height: 100vh; width: 100%;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    scrollbar-width: none;
    display: block;
}
.feed::-webkit-scrollbar { display: none; }

.empty-feed {
    height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 24px; color: #bbb;
}
.empty-feed span { font-size: 55px; margin-bottom: 12px; }
.empty-feed h3 { font-size: 18px; margin-bottom: 6px; color: #fff; }
.empty-feed p { font-size: 13px; color: #888; max-width: 280px; line-height: 1.5; margin-bottom: 18px; }
.empty-feed .btn-start {
    background: var(--primary-gradient);
    color: white; border: none; padding: 12px 24px;
    font-size: 14px; font-weight: bold; border-radius: 25px; cursor: pointer;
}

.video-card{
    position: relative;
    height: 100vh; width: 100%;
    scroll-snap-align: start; scroll-snap-stop: always;
    display: flex; align-items: flex-end;
    background: #050505; overflow: hidden;
}

.video-player{
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%; object-fit: cover; z-index: 1;
}

.content{
    position: relative; z-index: 15; width: 100%;
    padding: 20px 16px 85px;
    background: linear-gradient(0deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.4) 60%, transparent 100%);
    pointer-events: none;
}
.content * { pointer-events: auto; }

.username{ font-size: 15px; font-weight: 700; text-shadow: 0 1px 4px rgba(0,0,0,0.8); cursor: pointer; }
.description{ font-size: 13px; max-width: 78%; line-height: 1.4; color: #eee; word-break: break-word; margin-top: 4px; }

.actions{
    position: absolute; left: 12px; bottom: 95px;
    display: flex; flex-direction: column; gap: 14px; align-items: center; z-index: 20;
}

.tiktok-avatar {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--primary-gradient);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; border: 2px solid white; cursor: pointer; margin-bottom: 4px;
}

.action-btn{
    background: rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(5px);
    border: none; color: white; font-size: 22px;
    width: 44px; height: 44px; border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.2s, color 0.2s;
}
.action-btn:active { transform: scale(0.85); }
.action-btn.liked { color: var(--primary); }
.action-label{ font-size: 11px; font-weight: 600; margin-top: -10px; text-shadow: 0 1px 3px #000; }

.progress-bar {
    position: absolute; bottom: 60px; left: 0;
    width: 100%; height: 3px; background: rgba(255,255,255,0.2); z-index: 25;
}
.progress-fill { height: 100%; width: 0%; background: var(--primary); }

.bottom-nav{
    position: fixed; bottom: 0; left: 0; right: 0; height: 60px;
    background: rgba(10, 10, 10, 0.95); backdrop-filter: blur(10px);
    border-top: 1px solid rgba(255,255,255,0.08);
    display: flex; justify-content: space-around; align-items: center; z-index: 40;
}

.nav-item{
    color: var(--text-muted); font-size: 11px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
}
.nav-item span{ font-size: 19px; }
.nav-item.active{ color: white; font-weight: bold; }

.nav-item.add-btn span {
    background: var(--primary-gradient); color: white;
    padding: 3px 16px; border-radius: 12px; font-weight: bold; font-size: 20px;
}

/* Modal Windows */
.full-modal, .bottom-sheet{
    display: none; position: fixed; inset: 0;
    background: var(--bg-dark); z-index: 55; overflow-y: auto;
}
.full-modal.active{ display: block; }

.bottom-sheet {
    inset: auto 0 0 0; height: 60vh;
    border-radius: 20px 20px 0 0;
    background: #141414; border-top: 1px solid #282828;
    z-index: 60; display: flex; flex-direction: column;
    transform: translateY(100%); transition: transform 0.3s ease;
}
.bottom-sheet.active { display: flex; transform: translateY(0); }

.modal-header{
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 18px; position: sticky; top: 0; background: #141414;
    z-index: 2; border-bottom: 1px solid #222;
}

.close-btn{
    background: #282828; border: none; color: white;
    padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 12px; font-weight: bold;
}

/* Comments Section */
.comments-list { flex: 1; overflow-y: auto; padding: 14px 18px; display: flex; flex-direction: column; gap: 12px; }
.comment-item { font-size: 13px; line-height: 1.4; background: #1e1e1e; padding: 10px 12px; border-radius: 10px; }
.comment-user { font-weight: bold; color: var(--primary); margin-bottom: 2px; }

.comment-input-box {
    padding: 12px 18px; border-top: 1px solid #222; display: flex; gap: 8px; background: #141414;
}
.comment-input-box input {
    flex: 1; background: #222; border: none; color: white; padding: 10px 14px; border-radius: 20px; font-size: 13px; outline: none;
}
.comment-input-box button {
    background: var(--primary-gradient); border: none; color: white; padding: 0 16px; border-radius: 20px; font-weight: bold; cursor: pointer;
}

/* Upload Box */
.upload-box { max-width: 480px; margin: 25px auto; padding: 0 18px; display: flex; flex-direction: column; gap: 15px; }
.file-dropzone { border: 2px dashed #444; border-radius: 16px; padding: 30px 16px; text-align: center; cursor: pointer; background: #141414; }
.preview-container { display: none; border-radius: 12px; overflow: hidden; max-height: 250px; background: #000; }
.preview-container video { width: 100%; max-height: 250px; object-fit: contain; }
.upload-textarea { width: 100%; background: #181818; border: 1px solid #333; border-radius: 12px; color: white; padding: 12px; outline: none; font-size: 14px; height: 80px; resize: none; }
.btn-publish { background: var(--primary-gradient); border: none; color: white; padding: 14px; border-radius: 14px; font-size: 15px; font-weight: bold; cursor: pointer; }
.btn-publish:disabled { opacity: 0.5; cursor: not-allowed; }

.tab-page { display: none; padding: 80px 20px 20px; text-align: center; }
.tab-page.active { display: block; }
</style>
</head>

<body>

<header><div class="logo">FLIX</div></header>

<!-- Main Feed -->
<div class="feed" id="feed"></div>

<!-- Generic Page Views for Bottom Nav -->
<div class="tab-page" id="explorePage"><h2>🔍 اكتشف المحتوى</h2><p style="color:#888; margin-top:10px;">صفحة الاستكشاف قيد التطوير...</p></div>
<div class="tab-page" id="notificationsPage"><h2>🔔 الإشعارات</h2><p style="color:#888; margin-top:10px;">لا توجد إشعارات جديدة حالياً.</p></div>
<div class="tab-page" id="profilePage"><h2>👤 صفحتي الشخصية</h2><p style="color:#888; margin-top:10px;">مرحباً بك في ملفك الشخصي!</p></div>

<!-- Bottom Navigation -->
<div class="bottom-nav">
    <div class="nav-item active" id="navHome" onclick="switchTab('home')"><span>🏠</span>الرئيسية</div>
    <div class="nav-item" id="navExplore" onclick="switchTab('explore')"><span>🔍</span>اكتشف</div>
    <div class="nav-item add-btn" onclick="openUploadModal()"><span>＋</span></div>
    <div class="nav-item" id="navNotif" onclick="switchTab('notif')"><span>🔔</span>الإشعارات</div>
    <div class="nav-item" id="navProfile" onclick="switchTab('profile')"><span>👤</span>صفحتي</div>
</div>

<!-- Comments Bottom Sheet -->
<div class="bottom-sheet" id="commentsSheet">
    <div class="modal-header">
        <h3>التعليقات 💬</h3>
        <button class="close-btn" onclick="closeComments()">✕ إغلاق</button>
    </div>
    <div class="comments-list" id="commentsList"></div>
    <div class="comment-input-box">
        <input type="text" id="commentInput" placeholder="اكتب تعليقاً...">
        <button onclick="sendComment()">إرسال</button>
    </div>
</div>

<!-- Upload Video Modal -->
<div class="full-modal" id="uploadModal">
    <div class="modal-header">
        <h2>رفع فيديو جديد</h2>
        <button class="close-btn" onclick="closeUploadModal()">⬅ رجوع</button>
    </div>

    <div class="upload-box">
        <input type="file" id="videoFileInput" accept="video/*" style="display: none;" onchange="handleFileSelect(event)">
        
        <div class="file-dropzone" id="dropzone" onclick="document.getElementById('videoFileInput').click()">
            <span style="font-size: 38px; display: block; margin-bottom: 8px;">📹</span>
            <b style="font-size: 14px;">اختر فيديو من جهازك</b>
        </div>

        <div class="preview-container" id="previewContainer">
            <video id="uploadPreview" playsinline autoplay loop></video>
        </div>

        <textarea id="videoCaption" class="upload-textarea" placeholder="اكتب وصفاً للفيديو..."></textarea>

        <button id="publishBtn" class="btn-publish" onclick="publishVideo()" disabled>نشر الفيديو 🚀</button>
    </div>
</div>

<script>
let realPosts = [];
let selectedVideoFile = null;
let currentCommentPostId = null;

const videoObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
        const vid = entry.target;
        if (entry.isIntersecting) {
            vid.muted = false;
            vid.play().catch(() => {});
        } else {
            vid.pause();
            vid.currentTime = 0;
        }
    });
}, { threshold: 0.6 });

function loadVideosFromDB() {
    db.collection("videos").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
        realPosts = [];
        snapshot.forEach((doc) => realPosts.push(doc.data()));
        renderFeed();
    });
}
loadVideosFromDB();

function renderFeed() {
    const feed = document.getElementById('feed');
    feed.innerHTML = '';

    if (realPosts.length === 0) {
        feed.innerHTML = `
            <div class="empty-feed">
                <span>🎬</span>
                <h3>لا توجد فيديوهات حتى الآن</h3>
                <p>اضغط على زر ( ＋ ) في الأسفل لرفع أول فيديو!</p>
                <button class="btn-start" onclick="openUploadModal()">＋ رفع فيديو الآن</button>
            </div>
        `;
        return;
    }

    realPosts.forEach((post) => {
        const card = document.createElement('section');
        card.className = 'video-card';
        card.id = post.id;

        card.innerHTML = `
            <video class="video-player" loop playsinline src="${post.videoUrl}"></video>
            <div class="content">
                <div class="username" onclick="switchTab('profile')">@${post.authorName || 'مستخدم'}</div>
                <p class="description">${post.caption || ''}</p>
            </div>
            <div class="actions">
                <div class="tiktok-avatar" onclick="switchTab('profile')">👤</div>
                
                <!-- زر الإعجاب -->
                <button class="action-btn ${post.isLiked ? 'liked' : ''}" onclick="toggleLike('${post.id}')">♥</button>
                <div class="action-label">${post.likes || 0}</div>

                <!-- زر التعليقات -->
                <button class="action-btn" onclick="openComments('${post.id}')">💬</button>
                <div class="action-label">${(post.comments || []).length}</div>

                <!-- زر المشاركة -->
                <button class="action-btn" onclick="sharePost('${post.videoUrl}')">🔗</button>
                <div class="action-label">مشاركة</div>
            </div>
            <div class="progress-bar"><div class="progress-fill"></div></div>
        `;

        const vid = card.querySelector('video');
        videoObserver.observe(vid);

        vid.ontimeupdate = () => {
            const fill = card.querySelector('.progress-fill');
            if (fill && vid.duration) {
                fill.style.width = `${(vid.currentTime / vid.duration) * 100}%`;
            }
        };

        card.addEventListener('click', (e) => {
            if (e.target.closest('.actions') || e.target.closest('.content')) return;
            if (vid.paused) vid.play(); else vid.pause();
        });

        feed.appendChild(card);
    });
}

/* --- أزرار التفاعل والإعجابات --- */
function toggleLike(postId) {
    const post = realPosts.find(p => p.id === postId);
    if (!post) return;
    const isLiked = !post.isLiked;
    const newLikes = isLiked ? (post.likes || 0) + 1 : Math.max(0, (post.likes || 0) - 1);
    
    db.collection("videos").doc(postId).update({ 
        likes: newLikes,
        isLiked: isLiked
    });
}

function sharePost(url) {
    if (navigator.clipboard) {
        navigator.clipboard.writeText(url);
        alert("تم نسخ رابط الفيديو إلى الحافظة! 🔗");
    } else {
        alert("رابط الفيديو: " + url);
    }
}

/* --- نظام التعليقات --- */
function openComments(postId) {
    currentCommentPostId = postId;
    const post = realPosts.find(p => p.id === postId);
    const commentsList = document.getElementById('commentsList');
    commentsList.innerHTML = '';

    const comments = post.comments || [];
    if (comments.length === 0) {
        commentsList.innerHTML = '<p style="text-align:center; color:#777; margin-top:20px;">لا توجد تعليقات بعد، كن أول المعلقين!</p>';
    } else {
        comments.forEach(c => {
            const div = document.createElement('div');
            div.className = 'comment-item';
            div.innerHTML = `<div class="comment-user">@${c.user}</div><div>${c.text}</div>`;
            commentsList.appendChild(div);
        });
    }

    document.getElementById('commentsSheet').classList.add('active');
}

function closeComments() {
    document.getElementById('commentsSheet').classList.remove('active');
    currentCommentPostId = null;
}

function sendComment() {
    const input = document.getElementById('commentInput');
    const text = input.value.trim();
    if (!text || !currentCommentPostId) return;

    const post = realPosts.find(p => p.id === currentCommentPostId);
    const comments = post.comments || [];
    comments.push({ user: "زائر", text: text });

    db.collection("videos").doc(currentCommentPostId).update({ comments: comments }).then(() => {
        input.value = '';
        openComments(currentCommentPostId);
    });
}

/* --- التنقل السفلية --- */
function switchTab(tab) {
    document.getElementById('feed').style.display = 'none';
    document.querySelectorAll('.tab-page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));

    if (tab === 'home') {
        document.getElementById('feed').style.display = 'block';
        document.getElementById('navHome').classList.add('active');
    } else if (tab === 'explore') {
        document.getElementById('explorePage').classList.add('active');
        document.getElementById('navExplore').classList.add('active');
    } else if (tab === 'notif') {
        document.getElementById('notificationsPage').classList.add('active');
        document.getElementById('navNotif').classList.add('active');
    } else if (tab === 'profile') {
        document.getElementById('profilePage').classList.add('active');
        document.getElementById('navProfile').classList.add('active');
    }
}

/* --- رفع الفيديوهات --- */
function openUploadModal() { document.getElementById('uploadModal').classList.add('active'); }
function closeUploadModal() {
    document.getElementById('uploadModal').classList.remove('active');
    selectedVideoFile = null;
    document.getElementById('dropzone').style.display = 'block';
    document.getElementById('previewContainer').style.display = 'none';
    document.getElementById('publishBtn').disabled = true;
    document.getElementById('publishBtn').textContent = "نشر الفيديو 🚀";
}

function handleFileSelect(e) {
    const file = e.target.files[0];
    if (!file) return;
    selectedVideoFile = file;
    const preview = document.getElementById('uploadPreview');
    preview.src = URL.createObjectURL(file);
    document.getElementById('dropzone').style.display = 'none';
    document.getElementById('previewContainer').style.display = 'block';
    document.getElementById('publishBtn').disabled = false;
}

async function publishVideo() {
    if (!selectedVideoFile) return;

    const publishBtn = document.getElementById('publishBtn');
    publishBtn.disabled = true;
    publishBtn.textContent = "جاري رفع الفيديو... ⏳";

    const formData = new FormData();
    formData.append('file', selectedVideoFile);

    try {
        const res = await fetch('https://tmpfiles.org/api/v1/upload', {
            method: 'POST',
            body: formData
        });
        const data = await res.json();

        if (data.status === 'success' && data.data.url) {
            const directUrl = data.data.url.replace('tmpfiles.org/', 'tmpfiles.org/dl/');
            
            const videoId = "vid_" + Date.now();
            const newPost = {
                id: videoId,
                videoUrl: directUrl,
                caption: document.getElementById('videoCaption').value.trim(),
                authorName: "صانع محتوى",
                likes: 0,
                isLiked: false,
                comments: [],
                createdAt: Date.now()
            };

            await db.collection("videos").doc(videoId).set(newPost);
            closeUploadModal();
            alert("تم نشر الفيديو وتفعيل جميع الأزرار بنجاح! 🎉");
        } else {
            throw new Error('Upload failed');
        }
    } catch (err) {
        alert("حدث خطأ أثناء الرفع، جرب مرة أخرى.");
        publishBtn.disabled = false;
        publishBtn.textContent = "نشر الفيديو 🚀";
    }
}
</script>
</body>
</html>
