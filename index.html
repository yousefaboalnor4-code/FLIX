        <h2>رفع فيديو جديد</h2>

    </div>

    <div class="upload-box">
        <input type="file" id="videoFileInput" accept="video/*" style="display: none;" onchange="handleFileSelect(event)">

            <video id="uploadPreview" playsinline autoplay loop></video>
        </div>

        <textarea id="videoCaption" class="upload-textarea" placeholder="اكتب وصفاً للفيديو..."></textarea>

    </div>

<script>
let realPosts = [];
let selectedVideoFile = null;

const videoObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
        const vid = entry.target;
        if (entry.isIntersecting) {
            vid.muted = false;
            vid.play().catch(() => {});
        } else {
            vid.pause();
            vid.currentTime = 0;
        }
    });
}, { threshold: 0.6 });

function loadVideosFromDB() {
    db.collection("videos").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
        realPosts = [];
        snapshot.forEach((doc) => realPosts.push(doc.data()));
        renderFeed();
    });
}
loadVideosFromDB();

function renderFeed() {
    const feed = document.getElementById('feed');
    feed.innerHTML = '';

    if (realPosts.length === 0) {
        feed.innerHTML = `
            <div class="empty-feed">
                <span>🎬</span>
                <h3>لا توجد فيديوهات حتى الآن</h3>
                <p>اضغط على زر ( ＋ ) في الأسفل لرفع أول فيديو!</p>
                <button class="btn-start" onclick="openUploadModal()">＋ رفع فيديو الآن</button>
            </div>
        `;
        return;
    }

    realPosts.forEach((post) => {
        const card = document.createElement('section');
        card.className = 'video-card';
        card.id = post.id;

        card.innerHTML = `
            <video class="video-player" loop playsinline src="${post.videoUrl}"></video>
            <div class="content">
                <div class="username">@${post.authorName || 'مستخدم'}</div>
                <p class="description">${post.caption || ''}</p>
            </div>
            <div class="actions">
                <div class="tiktok-avatar">👤</div>
                <button class="action-btn ${post.isLiked ? 'liked' : ''}" onclick="toggleLike('${post.id}')">♥</button>
                <div class="action-label">${post.likes || 0}</div>
            </div>
            <div class="progress-bar"><div class="progress-fill"></div></div>
        `;

        const vid = card.querySelector('video');
        videoObserver.observe(vid);

        vid.ontimeupdate = () => {
            const fill = card.querySelector('.progress-fill');
            if (fill && vid.duration) {
                fill.style.width = `${(vid.currentTime / vid.duration) * 100}%`;
            }
        };

        card.addEventListener('click', (e) => {
            if (e.target.closest('.actions')) return;
            if (vid.paused) vid.play(); else vid.pause();
        });

        feed.appendChild(card);
    });
}

function toggleLike(postId) {
    const post = realPosts.find(p => p.id === postId);
    if (!post) return;
    const newLikes = (post.likes || 0) + 1;
    db.collection("videos").doc(postId).update({ likes: newLikes });
}

function openUploadModal() { document.getElementById('uploadModal').classList.add('active'); }
function closeUploadModal() {
    document.getElementById('uploadModal').classList.remove('active');
    selectedVideoFile = null;
    document.getElementById('dropzone').style.display = 'block';
    document.getElementById('previewContainer').style.display = 'none';
    document.getElementById('publishBtn').disabled = true;
    document.getElementById('publishBtn').textContent = "نشر الفيديو 🚀";
}

function handleFileSelect(e) {
    const file = e.target.files[0];
    if (!file) return;
    selectedVideoFile = file;
    const preview = document.getElementById('uploadPreview');
    preview.src = URL.createObjectURL(file);
    document.getElementById('dropzone').style.display = 'none';
    document.getElementById('previewContainer').style.display = 'block';
    document.getElementById('publishBtn').disabled = false;
}

// الرفع المجاني السريع بدون الحاجة لخدمة Firebase Storage
function publishVideo() {
    if (!selectedVideoFile) return;

    const publishBtn = document.getElementById('publishBtn');
    publishBtn.disabled = true;
    publishBtn.textContent = "جاري رفع الفيديو مجاناً... ⏳";

    const formData = new FormData();
    formData.append('file', selectedVideoFile);
    formData.append('upload_preset', 'ml_default'); // سيرفر استضافة مجاني سريح للفيديوهات

    fetch('https://api.cloudinary.com/v1_1/demo/video/upload', {
        method: 'POST',
        body: formData
    })
    .then(res => res.json())
    .then(data => {
        if (data.secure_url) {
            const videoId = "vid_" + Date.now();
            const newPost = {
                id: videoId,
                videoUrl: data.secure_url,
                caption: document.getElementById('videoCaption').value.trim(),
                authorName: "صانع محتوى",
                likes: 0,
                createdAt: Date.now()
            };

            db.collection("videos").doc(videoId).set(newPost).then(() => {
                closeUploadModal();
                alert("تم نشر الفيديو بنجاح وظهر للجميع الآن! 🎉");
            });
        } else {
            alert("حدث خطأ بسيط في الرفع، جرب فيديو بحجم أصغر.");
            publishBtn.disabled = false;
            publishBtn.textContent = "نشر الفيديو 🚀";
        }
    })
    .catch(() => {
        alert("حدث خطأ أثناء الرفع، يرجى المحاولة مرة أخرى.");
        publishBtn.disabled = false;
        publishBtn.textContent = "نشر الفيديو 🚀";
    });
}
</script>
</body>

<script>
let db;
let realPosts = [];
let activeVideoId = null;
let selectedVideoFile = null;
let currentTab = 'home';
let viewedUserName = null; // الحساب المعروض حالياً

let myName = localStorage.getItem('flix_my_name') || "مستخدم جديد";
let myAvatar = localStorage.getItem('flix_my_avatar') || "👤";
let myBio = localStorage.getItem('flix_my_bio') || "مرحباً بك في صفحتي على FLIX ✨";

// حل مشكلة كتم الصوت عند عمل ريستارت أو ريفريش للموقع
function forceUnmuteAudio() {
    document.querySelectorAll('video').forEach(v => {
        v.muted = false;
    });
    const activeVid = document.querySelector('.video-card video');
    if (activeVid) {
        activeVid.muted = false;
        activeVid.play().catch(()=>{});
    }
}
window.addEventListener('pointerdown', forceUnmuteAudio, { once: true });
window.addEventListener('touchstart', forceUnmuteAudio, { once: true });
window.addEventListener('click', forceUnmuteAudio, { once: true });

// Initialize IndexedDB
const request = indexedDB.open("FlixRealStorageDB", 1);
request.onupgradeneeded = (e) => {
    db = e.target.result;
    if (!db.objectStoreNames.contains("videos")) {
        db.createObjectStore("videos", { keyPath: "id" });
    }
};

request.onsuccess = (e) => {
    db = e.target.result;
    loadVideosFromDB();
};

// تشغيل الفيديو مع الصوت تلقائياً
const videoObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
        const vid = entry.target;
        if (entry.isIntersecting && currentTab === 'home') {
            vid.muted = false;
            vid.play().catch(() => {
                vid.muted = true;
                vid.play().then(() => {
                    // فتح الصوت فوراً عند أول تفاعل
                    const unmuteOnInteraction = () => {
                        vid.muted = false;
                        window.removeEventListener('click', unmuteOnInteraction);
                        window.removeEventListener('touchstart', unmuteOnInteraction);
                    };
                    window.addEventListener('click', unmuteOnInteraction);
                    window.addEventListener('touchstart', unmuteOnInteraction);
                }).catch(()=>{});
            });
        } else {
            vid.pause();
            vid.currentTime = 0;
        }
    });
}, { threshold: 0.6 });

function loadVideosFromDB() {
    const tx = db.transaction("videos", "readonly");
    const store = tx.objectStore("videos");
    const getAll = store.getAll();

    getAll.onsuccess = () => {
        realPosts = (getAll.result || []).sort((a, b) => b.createdAt - a.createdAt);
        renderFeed();
        renderSearchList('');
        if (currentTab === 'profile') renderProfile(viewedUserName || myName);
    };
}

function saveVideoToDB(postData, callback) {
    const tx = db.transaction("videos", "readwrite");
    const store = tx.objectStore("videos");
    store.put(postData);
    tx.oncomplete = () => {
        if (callback) callback();
    };
}

function deleteVideoFromDB(postId) {
    if (!confirm("هل أنت متأكد من حذف هذا الفيديو نهائياً؟")) return;
    
    const tx = db.transaction("videos", "readwrite");
    const store = tx.objectStore("videos");
    store.delete(postId);
    tx.oncomplete = () => {
        realPosts = realPosts.filter(p => p.id !== postId);
        renderFeed();
        renderProfile(viewedUserName || myName);
    };
}

function switchTab(tab) {
    currentTab = tab;
    const feed = document.getElementById('feed');
    const searchView = document.getElementById('searchView');
    const profileView = document.getElementById('profileView');
    
    const navHome = document.getElementById('navHome');
    const navSearch = document.getElementById('navSearch');
    const navProfile = document.getElementById('navProfile');

    // إخفاء الكل
    feed.style.display = 'none';
    searchView.classList.remove('active');
    profileView.classList.remove('active');
    navHome.classList.remove('active');
    navSearch.classList.remove('active');
    navProfile.classList.remove('active');

    // إيقاف الفيديوهات عند الخروج من الرئيسية
    document.querySelectorAll('.video-player').forEach(v => v.pause());

    if (tab === 'home') {
        feed.style.display = 'block';
        navHome.classList.add('active');
        feed.scrollTo({ top: 0, behavior: 'smooth' });
        
        const visibleVid = feed.querySelector('.video-card video');
        if (visibleVid) {
            visibleVid.muted = false;
            visibleVid.play().catch(()=>{});
        }
    } else if (tab === 'search') {
        searchView.classList.add('active');
        navSearch.classList.add('active');
        renderSearchList(document.getElementById('searchInput').value);
    } else if (tab === 'profile') {
        profileView.classList.add('active');
        navProfile.classList.add('active');
    }
}

function openMyProfile() {
    viewedUserName = myName;
    switchTab('profile');
    renderProfile(myName);
}

function viewUserProfile(username) {
    viewedUserName = username;
    switchTab('profile');
    renderProfile(username);
}

function renderFeed() {
    const feed = document.getElementById('feed');
    feed.innerHTML = '';

    if (realPosts.length === 0) {
        feed.innerHTML = `
            <div class="empty-feed">
                <span>🎬</span>
                <h3>لا توجد فيديوهات حتى الآن</h3>
                <p>اضغط على زر ( ＋ ) في الأسفل لرفع أول فيديو لك!</p>
                <button class="btn-start" onclick="openUploadModal()">＋ رفع فيديو الآن</button>
            </div>
        `;
        return;
    }

    realPosts.forEach((post) => {
        const videoSrc = URL.createObjectURL(post.videoBlob);
        const card = document.createElement('section');
        card.className = 'video-card';
        card.id = post.id;
        
        const authorAvatar = post.authorAvatar || '👤';

        card.innerHTML = `
            <video class="video-player" loop playsinline src="${videoSrc}"></video>
            <div class="heart-anim" id="heart_${post.id}">❤️</div>
            <div class="content">
                <div class="user-info" onclick="viewUserProfile('${post.authorName}')">
                    <span class="username">@${post.authorName || 'مستخدم'}</span>
                </div>
                <p class="description">${post.caption || ''}</p>
            </div>
            <div class="actions">
                <!-- صورة الحساب تيك توك ستايل قابلة للضغط لفتح البروفايل -->
                <div class="tiktok-avatar" onclick="viewUserProfile('${post.authorName}')" title="عرض البروفايل">
                    ${authorAvatar}
                </div>

                <button class="action-btn ${post.isLiked ? 'liked' : ''}" onclick="toggleLike('${post.id}')">♥</button>
                <div class="action-label" id="like_count_${post.id}">${post.likes}</div>
                
                <button class="action-btn" onclick="openComments('${post.id}')">💬</button>
                <div class="action-label" id="comment_count_${post.id}">${post.comments.length}</div>
                
                <button class="action-btn" onclick="sharePost()">↗</button>
                <div class="action-label">مشاركة</div>
            </div>
            <div class="progress-bar"><div class="progress-fill"></div></div>
        `;

        const vid = card.querySelector('video');
        vid.muted = false;
        videoObserver.observe(vid);

        vid.ontimeupdate = () => {
            const fill = card.querySelector('.progress-fill');
            if (fill && vid.duration) {
                fill.style.width = `${(vid.currentTime / vid.duration) * 100}%`;
            }
        };

        let lastTap = 0;
        card.addEventListener('click', (e) => {
            if (e.target.closest('.actions') || e.target.closest('.user-info')) return;
            
            const currentTime = new Date().getTime();
            const tapLength = currentTime - lastTap;
            
            if (tapLength < 300 && tapLength > 0) {
                if (!post.isLiked) toggleLike(post.id);
                showHeartAnimation(post.id);
            } else {
                vid.muted = false;
                if (vid.paused) vid.play();
                else vid.pause();
            }
            lastTap = currentTime;
        });

        feed.appendChild(card);
    });
}

/* محرك البحث عن الحسابات */
function handleSearch(query) {
    renderSearchList(query);
}

function renderSearchList(query) {
    const list = document.getElementById('usersList');
    list.innerHTML = '';

    // جمع كل الحسابات من الفيديوهات + حسابي الشخصي
    const usersMap = new Map();
    usersMap.set(myName, { name: myName, avatar: myAvatar, bio: myBio });

    realPosts.forEach(p => {
        if (!usersMap.has(p.authorName)) {
            usersMap.set(p.authorName, {
                name: p.authorName,
                avatar: p.authorAvatar || '👤',
                bio: p.authorBio || 'صانع محتوى على FLIX ✨'
            });
        }
    });

    const filtered = Array.from(usersMap.values()).filter(u => 
        u.name.toLowerCase().includes(query.toLowerCase().trim())
    );

    if (filtered.length === 0) {
        list.innerHTML = `<div style="text-align:center;color:#666;padding:40px 0;font-size:13px;">لم يتم العثور على حساب بهذا الاسم 🔍</div>`;
        return;
    }

    filtered.forEach(u => {
        const item = document.createElement('div');
        item.className = 'user-search-card';
        item.onclick = () => viewUserProfile(u.name);

        item.innerHTML = `
            <div class="user-search-left">
                <div class="user-search-avatar">${u.avatar}</div>
                <div>
                    <div class="user-search-name">${u.name}</div>
                    <div class="user-search-tag">@${u.name.toLowerCase().replace(/\s+/g, '_')}</div>
                </div>
            </div>
            <button class="profile-btn" style="font-size:11px; padding:5px 14px;">عرض 👁️</button>
        `;
        list.appendChild(item);
    });
}

/* عرض بروفايل أي شخص */
function renderProfile(username) {
    const isMe = (username === myName);
    
    // جلب بيانات الحساب
    let userAvatar = isMe ? myAvatar : '👤';
    let userBio = isMe ? myBio : 'صانع محتوى على FLIX ✨';

    const userPost = realPosts.find(p => p.authorName === username);
    if (!isMe && userPost) {
        if (userPost.authorAvatar) userAvatar = userPost.authorAvatar;
        if (userPost.authorBio) userBio = userPost.authorBio;
    }

    document.getElementById('profileAvatar').textContent = userAvatar;
    document.getElementById('profileNameDisplay').textContent = username;
    document.getElementById('profileTagDisplay').textContent = `@${username.toLowerCase().replace(/\s+/g, '_')}`;
    document.getElementById('profileBioDisplay').textContent = userBio;

    const actionContainer = document.getElementById('profileActionContainer');
    if (isMe) {
        actionContainer.innerHTML = `<button class="profile-btn" onclick="openEditProfileModal()">✏️ تعديل الحساب</button>`;
    } else {
        actionContainer.innerHTML = `<button class="profile-btn follow-btn" onclick="alert('تمت المتابعة بنجاح! 🔔')">➕ متابعة</button>`;
    }

    const userPosts = realPosts.filter(p => p.authorName === username || (isMe && p.isMine));
    const totalLikes = userPosts.reduce((acc, curr) => acc + (curr.likes || 0), 0);

    document.getElementById('statVideos').textContent = userPosts.length;
    document.getElementById('statLikes').textContent = totalLikes;

    const grid = document.getElementById('profileVideoGrid');
    grid.innerHTML = '';

    if (userPosts.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding: 40px 0; color:#777; font-size:13px;">لا توجد فيديوهات منشورة حتى الآن 📷</div>`;
        return;
    }

    userPosts.forEach(post => {
        const item = document.createElement('div');
        item.className = 'grid-item';
        const vidUrl = URL.createObjectURL(post.videoBlob);
        
        item.innerHTML = `
            <video src="${vidUrl}#t=0.5" preload="metadata" muted></video>
            <div class="grid-meta">♥ ${post.likes}</div>
            ${isMe ? `<button class="grid-delete-btn" onclick="event.stopPropagation(); deleteVideoFromDB('${post.id}')" title="حذف">🗑</button>` : ''}
        `;

        item.onclick = () => {
            switchTab('home');
            const target = document.getElementById(post.id);
            if (target) target.scrollIntoView({ behavior: 'smooth' });
        };

        grid.appendChild(item);
    });
}

function openEditProfileModal() {
    document.getElementById('editAvatarInput').value = myAvatar;
    document.getElementById('editNameInput').value = myName;
    document.getElementById('editBioInput').value = myBio;
    document.getElementById('editProfileModal').classList.add('active');
}

function closeEditProfileModal() {
    document.getElementById('editProfileModal').classList.remove('active');
}

function saveProfileData() {
    const avatar = document.getElementById('editAvatarInput').value.trim();
    const name = document.getElementById('editNameInput').value.trim();
    const bio = document.getElementById('editBioInput').value.trim();

    if (avatar) {
        myAvatar = avatar;
        localStorage.setItem('flix_my_avatar', myAvatar);
    }
    if (name) {
        myName = name;
        localStorage.setItem('flix_my_name', myName);
    }
    if (bio) {
        myBio = bio;
        localStorage.setItem('flix_my_bio', myBio);
    }

    renderProfile(myName);
    renderFeed();
    closeEditProfileModal();
}

function showHeartAnimation(postId) {
    const heart = document.getElementById(`heart_${postId}`);
    if (heart) {
        heart.classList.add('pop');
        setTimeout(() => heart.classList.remove('pop'), 600);
    }
}

function toggleLike(postId) {
    const post = realPosts.find(p => p.id === postId);
    if (!post) return;

    post.isLiked = !post.isLiked;
    post.likes += post.isLiked ? 1 : -1;
    saveVideoToDB(post);

    const btn = document.querySelector(`#${postId} .action-btn`);
    const count = document.getElementById(`like_count_${postId}`);
    if (btn && count) {
        btn.classList.toggle('liked', post.isLiked);
        count.textContent = post.likes;
    }
    if (post.isLiked) showHeartAnimation(postId);
    if (currentTab === 'profile') renderProfile(viewedUserName || myName);
}

function sharePost() {
    if (navigator.share) {
        navigator.share({
            title: 'FLIX',
            text: 'شاهد هذا الفيديو على FLIX!',
            url: window.location.href
        }).catch(()=>{});
    } else {
        alert("تم نسخ رابط الفيديو والموقع بنجاح! 🔗");
    }
}

function openComments(postId) {
    activeVideoId = postId;
    const post = realPosts.find(p => p.id === postId);
    if (!post) return;

    const list = document.getElementById('commentsList');
    list.innerHTML = '';
    
    if (!post.comments || post.comments.length === 0) {
        list.innerHTML = `<div style="text-align:center;color:#666;padding:30px 0;">لا توجد تعليقات بعد، كن أول من يعلق!</div>`;
    } else {
        post.comments.forEach(c => {
            const item = document.createElement('div');
            item.className = 'comment-item';
            item.innerHTML = `<strong>👤 ${c.user}</strong>${c.text}`;
            list.appendChild(item);
        });
    }
    document.getElementById('commentSheet').classList.add('show');
}

function closeComments() {
    document.getElementById('commentSheet').classList.remove('show');
}

function submitComment() {
    const input = document.getElementById('commentInput');
    const text = input.value.trim();
    if (!text || !activeVideoId) return;

    const post = realPosts.find(p => p.id === activeVideoId);
    if (post) {
        post.comments.push({ user: myName, text: text, time: Date.now() });
        saveVideoToDB(post, () => {
            const count = document.getElementById(`comment_count_${activeVideoId}`);
            if (count) count.textContent = post.comments.length;
            input.value = '';
            openComments(activeVideoId);
        });
    }
}

function openUploadModal() {
    document.getElementById('uploadModal').classList.add('active');
}

function closeUploadModal() {
    document.getElementById('uploadModal').classList.remove('active');
    selectedVideoFile = null;
    document.getElementById('dropzone').style.display = 'block';
    document.getElementById('previewContainer').style.display = 'none';
    document.getElementById('publishBtn').disabled = true;
    document.getElementById('videoCaption').value = '';
}

function handleFileSelect(e) {
    const file = e.target.files[0];
    if (!file) return;

    selectedVideoFile = file;
    const preview = document.getElementById('uploadPreview');
    preview.src = URL.createObjectURL(file);
    preview.muted = false;
    document.getElementById('dropzone').style.display = 'none';
    document.getElementById('previewContainer').style.display = 'block';
    document.getElementById('publishBtn').disabled = false;
}

function publishVideo() {
    if (!selectedVideoFile) return;

    const publishBtn = document.getElementById('publishBtn');
    publishBtn.disabled = true;

    const newPost = {
        id: "vid_" + Date.now(),
        videoBlob: selectedVideoFile,
        caption: document.getElementById('videoCaption').value.trim(),
        authorName: myName,
        authorAvatar: myAvatar,
        authorBio: myBio,
        isMine: true,
        likes: 0,
        isLiked: false,
        comments: [],
        createdAt: Date.now()
    };

    saveVideoToDB(newPost, () => {
        realPosts.unshift(newPost);
        renderFeed();
        renderSearchList('');
        closeUploadModal();
        alert("تم نشر الفيديو بنجاح! 🚀");
    });
}
</script>
