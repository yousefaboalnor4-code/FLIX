<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  const db = firebase.firestore();

<style>
*{ box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
body{ background: #000; color: #fff; overflow: hidden; height: 100vh; }

header{
    position: fixed; top: 0; left: 0; right: 0; height: 50px;
    display: flex; align-items: center; justify-content: center;
    z-index: 10; background: rgba(0,0,0,0.5); font-size: 22px; font-weight: bold; color: #ff1744;
}

.feed{ height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; }
.feed::-webkit-scrollbar { display: none; }

.video-card{
    position: relative; height: 100vh; width: 100%;
    scroll-snap-align: start; scroll-snap-stop: always;
    display: flex; align-items: flex-end; background: #000;
}

video{ position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }

.content{ position: relative; z-index: 5; padding: 20px; width: 100%; background: linear-gradient(transparent, rgba(0,0,0,0.8)); }
.username{ font-size: 16px; font-weight: bold; margin-bottom: 5px; }
.caption{ font-size: 14px; color: #ddd; }

.actions{
    position: absolute; left: 15px; bottom: 80px; z-index: 5;
    display: flex; flex-direction: column; gap: 20px; align-items: center;
}

.btn-action{
    background: rgba(0,0,0,0.5); border: none; color: #fff;
    width: 48px; height: 48px; border-radius: 50%; font-size: 20px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-direction: column;
}
.btn-action.liked{ color: #ff1744; }
.btn-action span{ font-size: 10px; margin-top: 2px; }

.nav{
    position: fixed; bottom: 0; left: 0; right: 0; height: 55px;
    background: #000; display: flex; justify-content: space-around; align-items: center; z-index: 10;
    border-top: 1px solid #222;
}
.add-btn{ background: #ff1744; color: #fff; border: none; padding: 8px 20px; border-radius: 20px; font-size: 18px; font-weight: bold; }

/* Modal */
.modal{ display: none; position: fixed; inset: 0; background: #111; z-index: 20; padding: 20px; flex-direction: column; gap: 15px; }
.modal.active{ display: flex; }
.modal input, .modal textarea{ background: #222; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 8px; font-size: 14px; }
.modal button{ background: #ff1744; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }
</style>
</head>

<body>

<header>FLIX</header>

<div class="feed" id="feed">
    <div style="text-align:center; padding-top: 50vh; color:#888;">جاري تحميل الفيديوهات...</div>
</div>

<div class="nav">
    <button class="add-btn" onclick="toggleModal(true)">＋ رفع فيديو</button>
</div>

<!-- Modal Upload -->
<div class="modal" id="uploadModal">
    <h2>رفع فيديو جديد</h2>
    <input type="file" id="videoFile" accept="video/*">
    <textarea id="videoCaption" placeholder="اكتب وصفاً للفيديو..."></textarea>
    <button id="uploadBtn" onclick="uploadVideo()">نشر الآن 🚀</button>
    <button style="background:#333;" onclick="toggleModal(false)">إلغاء</button>
</div>

<script>
function toggleModal(show) {
    document.getElementById('uploadModal').classList.toggle('active', show);
}

// تحميل الفيديوهات من قواعد البيانات
db.collection("videos").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
    const feed = document.getElementById('feed');
    feed.innerHTML = '';

    if(snapshot.empty) {
        feed.innerHTML = '<div style="text-align:center; padding-top: 45vh; color:#888;">لا توجد فيديوهات بعد.<br>اضغط على (+ رفع فيديو) في الأسفل.</div>';
        return;
    }

    snapshot.forEach((doc) => {
        const post = doc.data();
        const card = document.createElement('div');
        card.className = 'video-card';
        card.innerHTML = `
            <video loop playsinline src="${post.videoUrl}" onclick="this.paused ? this.play() : this.pause()"></video>
            <div class="content">
                <div class="username">@صانع_محتوى</div>
                <div class="caption">${post.caption || ''}</div>
            </div>
            <div class="actions">
                <button class="btn-action ${post.isLiked ? 'liked' : ''}" onclick="likePost('${doc.id}', ${post.likes || 0}, ${post.isLiked})">
                    ♥ <span>${post.likes || 0}</span>
                </button>
                <button class="btn-action" onclick="alert('رابط الفيديو: ${post.videoUrl}')">
                    🔗 <span>مشاركة</span>
                </button>
            </div>
        `;
        feed.appendChild(card);
    });

    // تشغيل الفيديو الظاهر تلقائياً
    const videos = document.querySelectorAll('video');
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(e => {
            if(e.isIntersecting) e.target.play().catch(()=>{});
            else e.target.pause();
        });
    }, { threshold: 0.7 });
    videos.forEach(v => observer.observe(v));
});

// زيادة الإعجابات
function likePost(id, currentLikes, isLiked) {
    db.collection("videos").doc(id).update({
        likes: isLiked ? currentLikes - 1 : currentLikes + 1,
        isLiked: !isLiked
    });
}

// رفع الفيديو باستخدام Cloudinary Unsigned
async function uploadVideo() {
    const fileInput = document.getElementById('videoFile');
    const captionInput = document.getElementById('videoCaption');
    const file = fileInput.files[0];

    if (!file) { alert("من فضلك اختر فيديو أولاً!"); return; }

    const btn = document.getElementById('uploadBtn');
    btn.disabled = true;
    btn.innerText = "جاري الرفع... ⏳";

    const formData = new FormData();
    formData.append('file', file);
    formData.append('upload_preset', 'ml_default'); // الإعداد الافتراضي العام

    try {
        const res = await fetch('https://api.cloudinary.com/v1_1/demo/video/upload', {
            method: 'POST',
            body: formData
        });
        const data = await res.json();

        if (data.secure_url) {
            await db.collection("videos").add({
                videoUrl: data.secure_url,
                caption: captionInput.value,
                likes: 0,
                isLiked: false,
                createdAt: Date.now()
            });

            btn.disabled = false;
            btn.innerText = "نشر الآن 🚀";
            fileInput.value = '';
            captionInput.value = '';
            toggleModal(false);
            alert("تم نشر الفيديو بنجاح! 🎉");
        } else {
            throw new Error("فشل الرفع");
        }
    } catch (err) {
        alert("حدث خطأ أثناء الرفع، تأكد من حجم الفيديو وحاول مجدداً.");
        btn.disabled = false;
        btn.innerText = "نشر الآن 🚀";
    }
}
</script>
</body>
</html>
