<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FLIX</title>

<style>
:root {
    --primary: #ff1744;
    --primary-gradient: linear-gradient(45deg, #ff1744, #ff5252);
    --bg-dark: #0a0a0a;
    --text-main: #ffffff;
    --text-muted: #aaaaaa;
}

*{
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
}

body{
    background: #000;
    color: var(--text-main);
    overflow: hidden;
    height: 100vh;
    width: 100vw;
}

header{
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 16px;
    z-index: 30;
    background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, transparent 100%);
    pointer-events: none;
}
header * { pointer-events: auto; }

.logo{
    font-size: 26px;
    font-weight: 900;
    letter-spacing: 2px;
    background: var(--primary-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

/* Feed View */
.feed{
    height: 100vh;
    width: 100%;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    scrollbar-width: none;
    display: block;
}
.feed::-webkit-scrollbar { display: none; }

.empty-feed {
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    color: #bbb;
}
.empty-feed span { font-size: 65px; margin-bottom: 15px; }
.empty-feed h3 { font-size: 20px; margin-bottom: 8px; color: #fff; }
.empty-feed p { font-size: 14px; color: #888; max-width: 300px; line-height: 1.5; margin-bottom: 20px; }
.empty-feed .btn-start {
    background: var(--primary-gradient);
    color: white;
    border: none;
    padding: 13px 26px;
    font-size: 15px;
    font-weight: bold;
    border-radius: 25px;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(255, 23, 68, 0.4);
}

.video-card{
    position: relative;
    height: 100vh;
    width: 100%;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    display: flex;
    align-items: flex-end;
    background: #050505;
    overflow: hidden;
}

.video-player{
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: 1;
}

.heart-anim {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-size: 90px;
    z-index: 10;
    pointer-events: none;
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
    opacity: 0;
}
.heart-anim.pop {
    transform: translate(-50%, -50%) scale(1.3);
    opacity: 1;
}

.content{
    position: relative;
    z-index: 15;
    width: 100%;
    padding: 20px 16px 85px;
    background: linear-gradient(0deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.4) 60%, transparent 100%);
    pointer-events: none;
}
.content * { pointer-events: auto; }

.user-info{
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
}
.username{ font-size: 16px; font-weight: 700; text-shadow: 0 1px 4px rgba(0,0,0,0.8); }

.description{
    font-size: 14px;
    max-width: 78%;
    line-height: 1.4;
    color: #eee;
    word-break: break-word;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
}

.actions{
    position: absolute;
    left: 12px;
    bottom: 95px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    align-items: center;
    z-index: 20;
}

.action-btn{
    background: rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(5px);
    border: none;
    color: white;
    font-size: 22px;
    width: 48px; height: 48px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s, color 0.15s;
}
.action-btn:active { transform: scale(0.85); }
.action-btn.liked { color: var(--primary); }

.action-label{
    font-size: 11px;
    font-weight: 600;
    margin-top: -12px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
}

.progress-bar {
    position: absolute;
    bottom: 65px; left: 0;
    width: 100%; height: 3px;
    background: rgba(255,255,255,0.2);
    z-index: 25;
}
.progress-fill {
    height: 100%; width: 0%;
    background: var(--primary);
}

/* Bottom Nav */
.bottom-nav{
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 65px;
    background: rgba(10, 10, 10, 0.95);
    backdrop-filter: blur(10px);
    border-top: 1px solid rgba(255,255,255,0.08);
    display: flex;
    justify-content: space-around;
    align-items: center;
    z-index: 40;
}

.nav-item{
    color: var(--text-muted);
    font-size: 11px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    transition: color 0.2s;
}
.nav-item span{ font-size: 20px; }
.nav-item.active{ color: white; }

.nav-item.add-btn span {
    background: var(--primary-gradient);
    color: white;
    padding: 4px 16px;
    border-radius: 12px;
    font-weight: bold;
    font-size: 22px;
}

/* Profile View */
.profile-view {
    display: none;
    height: 100vh;
    width: 100%;
    overflow-y: auto;
    background: var(--bg-dark);
    padding: 70px 16px 85px;
}
.profile-view.active { display: block; }

.profile-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    margin-bottom: 24px;
}
.profile-avatar {
    width: 90px; height: 90px;
    border-radius: 50%;
    background: var(--primary-gradient);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    box-shadow: 0 4px 20px rgba(255, 23, 68, 0.3);
    margin-bottom: 12px;
}
.profile-name { font-size: 20px; font-weight: bold; margin-bottom: 4px; }
.profile-tag { font-size: 13px; color: var(--text-muted); margin-bottom: 12px; }
.profile-bio { font-size: 13px; color: #ddd; max-width: 320px; line-height: 1.5; margin-bottom: 16px; }

.profile-btn {
    background: #222;
    border: 1px solid #333;
    color: white;
    padding: 8px 20px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
}

.profile-stats {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin-bottom: 24px;
    border-top: 1px solid #1a1a1a;
    border-bottom: 1px solid #1a1a1a;
    padding: 14px 0;
}
.stat-box { text-align: center; }
.stat-num { font-size: 18px; font-weight: bold; }
.stat-lbl { font-size: 12px; color: var(--text-muted); }

.grid-title {
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
}
.video-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
}
.grid-item {
    position: relative;
    aspect-ratio: 9/16;
    background: #181818;
    border-radius: 6px;
    overflow: hidden;
    cursor: pointer;
}
.grid-item video {
    width: 100%;
    height: 100%;
    object-fit: cover;
}
.grid-meta {
    position: absolute;
    bottom: 6px;
    left: 6px;
    font-size: 11px;
    display: flex;
    align-items: center;
    gap: 4px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
}
.grid-delete-btn {
    position: absolute;
    top: 6px;
    left: 6px;
    background: rgba(0, 0, 0, 0.7);
    color: #ff5252;
    border: none;
    border-radius: 50%;
    width: 26px; height: 26px;
    font-size: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Modals and Sheets */
.full-modal{
    display: none;
    position: fixed;
    inset: 0;
    background: var(--bg-dark);
    z-index: 55;
    overflow-y: auto;
    padding-bottom: 80px;
}
.full-modal.active{ display: block; }

.modal-header{
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px;
    position: sticky;
    top: 0;
    background: var(--bg-dark);
    z-index: 2;
    border-bottom: 1px solid #222;
}

.close-btn{
    background: #282828;
    border: none;
    color: white;
    padding: 6px 14px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 13px;
    font-weight: bold;
}

.comment-sheet{
    position: fixed;
    bottom: -100%; left: 0; right: 0;
    height: 60vh;
    background: #181818;
    border-radius: 20px 20px 0 0;
    z-index: 60;
    transition: bottom 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
    display: flex;
    flex-direction: column;
}
.comment-sheet.show{ bottom: 0; }

.comments-list{
    flex: 1;
    overflow-y: auto;
    padding: 15px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
}
.comment-item{ font-size: 13px; line-height: 1.4; }
.comment-item strong{ color: #aaa; font-size: 12px; display: block; margin-bottom: 2px; }

.comment-input-area{
    padding: 12px 16px;
    background: #202020;
    display: flex;
    gap: 10px;
}
.comment-input{
    flex: 1;
    background: #2e2e2e;
    border: none;
    outline: none;
    color: white;
    padding: 10px 16px;
    border-radius: 20px;
    font-size: 13px;
}
.send-btn{
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 20px;
    padding: 0 16px;
    font-weight: bold;
    cursor: pointer;
}

.upload-box {
    max-width: 480px;
    margin: 30px auto;
    padding: 0 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.file-dropzone {
    border: 2px dashed #444;
    border-radius: 16px;
    padding: 35px 20px;
    text-align: center;
    cursor: pointer;
    background: #141414;
}

.preview-container {
    display: none;
    border-radius: 12px;
    overflow: hidden;
    max-height: 260px;
    background: #000;
}
.preview-container video { width: 100%; max-height: 260px; object-fit: contain; }

.upload-textarea {
    width: 100%; height: 80px;
    background: #181818;
    border: 1px solid #333;
    border-radius: 12px;
    color: white;
    padding: 12px;
    outline: none;
    resize: none;
    font-size: 14px;
}

.upload-input {
    width: 100%;
    background: #181818;
    border: 1px solid #333;
    border-radius: 12px;
    color: white;
    padding: 12px;
    outline: none;
    font-size: 14px;
}

.btn-publish {
    background: var(--primary-gradient);
    border: none;
    color: white;
    padding: 14px;
    border-radius: 14px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}
.btn-publish:disabled { opacity: 0.5; cursor: not-allowed; }

.upload-status {
    text-align: center;
    font-size: 13px;
    color: #00e676;
    display: none;
}
</style>
</head>

<body>

<header>
    <div class="logo">FLIX</div>
</header>

<!-- Main Feed -->
<div class="feed" id="feed"></div>

<!-- Profile Page -->
<div class="profile-view" id="profileView">
    <div class="profile-card">
        <div class="profile-avatar" id="profileAvatar">👤</div>
        <div class="profile-name" id="profileNameDisplay">المستخدم</div>
        <div class="profile-tag" id="profileTagDisplay">@user</div>
        <div class="profile-bio" id="profileBioDisplay">مرحباً بك في صفحتي على FLIX ✨</div>
        <button class="profile-btn" onclick="editProfile()">✏️ تعديل الحساب</button>
    </div>

    <div class="profile-stats">
        <div class="stat-box">
            <div class="stat-num" id="statVideos">0</div>
            <div class="stat-lbl">الفيديوهات</div>
        </div>
        <div class="stat-box">
            <div class="stat-num" id="statLikes">0</div>
            <div class="stat-lbl">الإعجابات</div>
        </div>
    </div>

    <div class="grid-title">📹 فيديوهاتي المنشورة</div>
    <div class="video-grid" id="profileVideoGrid"></div>
</div>

<!-- Bottom Navigation Bar -->
<div class="bottom-nav">
    <div class="nav-item active" id="navHome" onclick="switchTab('home')">
        <span>🏠</span>الرئيسية
    </div>
    <div class="nav-item add-btn" onclick="openUploadModal()">
        <span>＋</span>
    </div>
    <div class="nav-item" id="navProfile" onclick="switchTab('profile')">
        <span>👤</span>صفحتي
    </div>
</div>

<!-- Comments Sheet -->
<div class="comment-sheet" id="commentSheet">
    <div style="display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid #282828;">
        <h3>التعليقات</h3>
        <button class="close-btn" onclick="closeComments()">✕ إغلاق</button>
    </div>
    <div class="comments-list" id="commentsList"></div>
    <div class="comment-input-area">
        <input type="text" id="commentInput" class="comment-input" placeholder="اكتب تعليقك هنا..." onkeypress="if(event.key==='Enter') submitComment()">
        <button class="send-btn" onclick="submitComment()">إرسال</button>
    </div>
</div>

<!-- Upload Video Modal -->
<div class="full-modal" id="uploadModal">
    <div class="modal-header">
        <h2>رفع فيديو جديد</h2>
        <button class="close-btn" onclick="closeUploadModal()">⬅ رجوع</button>
    </div>

    <div class="upload-box">
        <input type="file" id="videoFileInput" accept="video/*" style="display: none;" onchange="handleFileSelect(event)">
        
        <div class="file-dropzone" id="dropzone" onclick="document.getElementById('videoFileInput').click()">
            <span style="font-size: 40px; display: block; margin-bottom: 10px;">📹</span>
            <b style="font-size: 15px;">اضغط هنا لاختيار فيديو من جهازك</b>
            <p style="font-size: 12px; color: #888; margin-top: 6px;">يدعم جميع صيغ الفيديو</p>
        </div>

        <div class="preview-container" id="previewContainer">
            <video id="uploadPreview" controls playsinline></video>
        </div>

        <textarea id="videoCaption" class="upload-textarea" placeholder="اكتب وصفاً للفيديو..."></textarea>

        <div class="upload-status" id="uploadStatus">جاري حفظ الفيديو...</div>
        <button id="publishBtn" class="btn-publish" onclick="publishVideo()" disabled>نشر الفيديو 🚀</button>
    </div>
</div>

<script>
let db;
let realPosts = [];
let activeVideoId = null;
let selectedVideoFile = null;
let currentTab = 'home';

let myName = localStorage.getItem('flix_my_name') || "مستخدم جديد";
let myBio = localStorage.getItem('flix_my_bio') || "مرحباً بك في صفحتي على FLIX ✨";

// Initialize IndexedDB
const request = indexedDB.open("FlixRealStorageDB", 1);
request.onupgradeneeded = (e) => {
    db = e.target.result;
    if (!db.objectStoreNames.contains("videos")) {
        db.createObjectStore("videos", { keyPath: "id" });
    }
};

request.onsuccess = (e) => {
    db = e.target.result;
    loadVideosFromDB();
};

// Intersection Observer for autoplaying visible video
const videoObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
        const vid = entry.target;
        if (entry.isIntersecting && currentTab === 'home') {
            vid.play().catch(() => {
                vid.muted = true;
                vid.play().catch(() => {});
            });
        } else {
            vid.pause();
            vid.currentTime = 0;
        }
    });
}, { threshold: 0.6 });

function loadVideosFromDB() {
    const tx = db.transaction("videos", "readonly");
    const store = tx.objectStore("videos");
    const getAll = store.getAll();

    getAll.onsuccess = () => {
        realPosts = (getAll.result || []).sort((a, b) => b.createdAt - a.createdAt);
        renderFeed();
        if (currentTab === 'profile') renderProfile();
    };
}

function saveVideoToDB(postData, callback) {
    const tx = db.transaction("videos", "readwrite");
    const store = tx.objectStore("videos");
    store.put(postData);
    tx.oncomplete = () => {
        if (callback) callback();
    };
}

function deleteVideoFromDB(postId) {
    if (!confirm("هل أنت متأكد من رغبتك في حذف هذا الفيديو نهائياً؟")) return;
    
    const tx = db.transaction("videos", "readwrite");
    const store = tx.objectStore("videos");
    store.delete(postId);
    tx.oncomplete = () => {
        realPosts = realPosts.filter(p => p.id !== postId);
        renderFeed();
        renderProfile();
    };
}

function switchTab(tab) {
    currentTab = tab;
    const feed = document.getElementById('feed');
    const profileView = document.getElementById('profileView');
    const navHome = document.getElementById('navHome');
    const navProfile = document.getElementById('navProfile');

    if (tab === 'home') {
        feed.style.display = 'block';
        profileView.classList.remove('active');
        navHome.classList.add('active');
        navProfile.classList.remove('active');
        feed.scrollTo({ top: 0, behavior: 'smooth' });
        
        // Resume playing visible video
        const visibleVid = feed.querySelector('.video-card video');
        if (visibleVid) visibleVid.play().catch(()=>{});
    } else if (tab === 'profile') {
        // Pause all videos
        document.querySelectorAll('.video-player').forEach(v => v.pause());
        feed.style.display = 'none';
        profileView.classList.add('active');
        navHome.classList.remove('active');
        navProfile.classList.add('active');
        renderProfile();
    }
}

function renderFeed() {
    const feed = document.getElementById('feed');
    feed.innerHTML = '';

    if (realPosts.length === 0) {
        feed.innerHTML = `
            <div class="empty-feed">
                <span>🎬</span>
                <h3>لا توجد فيديوهات حتى الآن</h3>
                <p>اضغط على زر ( ＋ ) في الأسفل لرفع أول فيديو لك في المنصة!</p>
                <button class="btn-start" onclick="openUploadModal()">＋ رفع فيديو الآن</button>
            </div>
        `;
        return;
    }

    realPosts.forEach((post) => {
        const videoSrc = URL.createObjectURL(post.videoBlob);
        const card = document.createElement('section');
        card.className = 'video-card';
        card.id = post.id;
        
        card.innerHTML = `
            <video class="video-player" loop playsinline preload="metadata" src="${videoSrc}"></video>
            <div class="heart-anim" id="heart_${post.id}">❤️</div>
            <div class="content">
                <div class="user-info"><span class="username">@${post.authorName || 'مستخدم'}</span></div>
                <p class="description">${post.caption || ''}</p>
            </div>
            <div class="actions">
                <button class="action-btn ${post.isLiked ? 'liked' : ''}" onclick="toggleLike('${post.id}')">♥</button>
                <div class="action-label" id="like_count_${post.id}">${post.likes}</div>
                <button class="action-btn" onclick="openComments('${post.id}')">💬</button>
                <div class="action-label" id="comment_count_${post.id}">${post.comments.length}</div>
                <button class="action-btn" onclick="sharePost()">↗</button>
                <div class="action-label">مشاركة</div>
            </div>
            <div class="progress-bar"><div class="progress-fill"></div></div>
        `;

        const vid = card.querySelector('video');
        videoObserver.observe(vid);

        vid.ontimeupdate = () => {
            const fill = card.querySelector('.progress-fill');
            if (fill && vid.duration) {
                fill.style.width = `${(vid.currentTime / vid.duration) * 100}%`;
            }
        };

        let lastTap = 0;
        card.addEventListener('click', (e) => {
            if (e.target.closest('.actions')) return;
            
            const currentTime = new Date().getTime();
            const tapLength = currentTime - lastTap;
            
            if (tapLength < 300 && tapLength > 0) {
                if (!post.isLiked) toggleLike(post.id);
                showHeartAnimation(post.id);
            } else {
                if (vid.paused) vid.play();
                else vid.pause();
            }
            lastTap = currentTime;
        });

        feed.appendChild(card);
    });
}

function renderProfile() {
    document.getElementById('profileNameDisplay').textContent = myName;
    document.getElementById('profileTagDisplay').textContent = `@${myName.toLowerCase().replace(/\s+/g, '_')}`;
    document.getElementById('profileBioDisplay').textContent = myBio;

    const myPosts = realPosts.filter(p => p.isMine || p.authorName === myName);
    const totalLikes = myPosts.reduce((acc, curr) => acc + (curr.likes || 0), 0);

    document.getElementById('statVideos').textContent = myPosts.length;
    document.getElementById('statLikes').textContent = totalLikes;

    const grid = document.getElementById('profileVideoGrid');
    grid.innerHTML = '';

    if (myPosts.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding: 40px 0; color:#777; font-size:13px;">لم تقم بنشر أي فيديو بعد 📷</div>`;
        return;
    }

    myPosts.forEach(post => {
        const item = document.createElement('div');
        item.className = 'grid-item';
        const vidUrl = URL.createObjectURL(post.videoBlob);
        
        item.innerHTML = `
            <video src="${vidUrl}#t=0.5" preload="metadata" muted></video>
            <div class="grid-meta">♥ ${post.likes}</div>
            <button class="grid-delete-btn" onclick="event.stopPropagation(); deleteVideoFromDB('${post.id}')" title="حذف">🗑</button>
        `;

        item.onclick = () => {
            switchTab('home');
            const target = document.getElementById(post.id);
            if (target) target.scrollIntoView({ behavior: 'smooth' });
        };

        grid.appendChild(item);
    });
}

function editProfile() {
    const newName = prompt("أدخل اسمك الشخصي الجديد:", myName);
    if (newName && newName.trim()) {
        myName = newName.trim();
        localStorage.setItem('flix_my_name', myName);
    }

    const newBio = prompt("اكتب نبذة عنك (Bio):", myBio);
    if (newBio !== null) {
        myBio = newBio.trim() || "مرحباً بك في صفحتي على FLIX ✨";
        localStorage.setItem('flix_my_bio', myBio);
    }

    renderProfile();
}

function showHeartAnimation(postId) {
    const heart = document.getElementById(`heart_${postId}`);
    if (heart) {
        heart.classList.add('pop');
        setTimeout(() => heart.classList.remove('pop'), 600);
    }
}

function toggleLike(postId) {
    const post = realPosts.find(p => p.id === postId);
    if (!post) return;

    post.isLiked = !post.isLiked;
    post.likes += post.isLiked ? 1 : -1;
    saveVideoToDB(post);

    const btn = document.querySelector(`#${postId} .action-btn`);
    const count = document.getElementById(`like_count_${postId}`);
    if (btn && count) {
        btn.classList.toggle('liked', post.isLiked);
        count.textContent = post.likes;
    }
    if (post.isLiked) showHeartAnimation(postId);
    if (currentTab === 'profile') renderProfile();
}

function sharePost() {
    if (navigator.share) {
        navigator.share({
            title: 'FLIX',
            text: 'شاهد هذا الفيديو على FLIX!',
            url: window.location.href
        }).catch(()=>{});
    } else {
        alert("تم نسخ رابط المنصة للمشاركة! 🔗");
    }
}

function openComments(postId) {
    activeVideoId = postId;
    const post = realPosts.find(p => p.id === postId);
    if (!post) return;

    const list = document.getElementById('commentsList');
    list.innerHTML = '';
    
    if (!post.comments || post.comments.length === 0) {
        list.innerHTML = `<div style="text-align:center;color:#666;padding:30px 0;">لا توجد تعليقات بعد، كن أول من يعلق!</div>`;
    } else {
        post.comments.forEach(c => {
            const item = document.createElement('div');
            item.className = 'comment-item';
            item.innerHTML = `<strong>👤 ${c.user}</strong>${c.text}`;
            list.appendChild(item);
        });
    }
    document.getElementById('commentSheet').classList.add('show');
}

function closeComments() {
    document.getElementById('commentSheet').classList.remove('show');
}

function submitComment() {
    const input = document.getElementById('commentInput');
    const text = input.value.trim();
    if (!text || !activeVideoId) return;

    const post = realPosts.find(p => p.id === activeVideoId);
    if (post) {
        post.comments.push({ user: myName, text: text, time: Date.now() });
        saveVideoToDB(post, () => {
            const count = document.getElementById(`comment_count_${activeVideoId}`);
            if (count) count.textContent = post.comments.length;
            input.value = '';
            openComments(activeVideoId);
        });
    }
}

function openUploadModal() {
    document.getElementById('uploadModal').classList.add('active');
}

function closeUploadModal() {
    document.getElementById('uploadModal').classList.remove('active');
    selectedVideoFile = null;
    document.getElementById('dropzone').style.display = 'block';
    document.getElementById('previewContainer').style.display = 'none';
    document.getElementById('publishBtn').disabled = true;
    document.getElementById('uploadStatus').style.display = 'none';
    document.getElementById('videoCaption').value = '';
}

function handleFileSelect(e) {
    const file = e.target.files[0];
    if (!file) return;

    selectedVideoFile = file;
    const preview = document.getElementById('uploadPreview');
    preview.src = URL.createObjectURL(file);
    document.getElementById('dropzone').style.display = 'none';
    document.getElementById('previewContainer').style.display = 'block';
    document.getElementById('publishBtn').disabled = false;
}

function publishVideo() {
    if (!selectedVideoFile) return;

    const publishBtn = document.getElementById('publishBtn');
    const statusText = document.getElementById('uploadStatus');

    publishBtn.disabled = true;
    statusText.style.display = 'block';

    const newPost = {
        id: "vid_" + Date.now(),
        videoBlob: selectedVideoFile,
        caption: document.getElementById('videoCaption').value.trim(),
        authorName: myName,
        isMine: true,
        likes: 0,
        isLiked: false,
        comments: [],
        createdAt: Date.now()
    };

    saveVideoToDB(newPost, () => {
        realPosts.unshift(newPost);
        renderFeed();
        closeUploadModal();
        alert("تم حفظ ونشر الفيديو في صفحتك بنجاح! 🚀");
    });
}
</script>
